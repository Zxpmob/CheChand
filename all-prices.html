<body>
<header class="site-header" id="site-header"></header>
<main>

<div class="container">
  <section class="hero" style="padding:40px 0 10px;text-align:right;">
    <span class="eyebrow"><span class="dot"></span> جدول کامل</span>
    <h1 style="font-size:clamp(1.6rem,4vw,2.4rem);">همه‌ی <span>قیمت‌ها</span> در یک جدول</h1>
    <p style="margin:0;">جست‌وجو کنید، بر اساس دسته فیلتر کنید و با کلیک روی هر ستون مرتب کنید.</p>
  </section>
  <section class="section">
    <div class="flex gap-12" style="flex-wrap:wrap;margin-bottom:18px;align-items:center;">
      <div class="search-box glass" style="flex:1;min-width:220px;">
        <input id="ap-search" type="text" placeholder="جست‌وجو در بین همه‌ی قیمت‌ها…">
      </div>
      <div class="flex gap-8" id="ap-pills" style="flex-wrap:wrap;"></div>
    </div>
    <div id="ap-table"></div>
  </section>
</div>

</main>
<footer class="site-footer" id="site-footer"></footer>

  <script src="items.js?v=20260815c" defer></script>
  <script src="data.js?v=20260815c" defer></script>
  <script src="favorites.js?v=20260815c" defer></script>
  <script src="alerts.js?v=20260815c" defer></script>
  <script src="render.js?v=20260815c" defer></script>
  <script src="components.js?v=20260815c" defer></script>

<script defer>
document.addEventListener("DOMContentLoaded", () => {
  renderHeader("all-prices.html");
  renderFooter();
  initPriceEngine();

  const pillsEl = document.getElementById("ap-pills");
  const cats = [{id:"all", title:"همه"}, ...SITE_CATEGORIES];
  let curCat = "all";
  function drawPills() {
    pillsEl.innerHTML = cats.map(c => `<button class="pill" data-c="${c.id}" aria-pressed="${c.id===curCat}">${c.title}</button>`).join("");
    pillsEl.querySelectorAll(".pill").forEach(b => b.addEventListener("click", () => {
      curCat = b.dataset.c; drawPills();
      renderAllPricesTable("ap-table", document.getElementById("ap-search").value, curCat);
    }));
  }
  drawPills();
  renderAllPricesTable("ap-table", "", "all");
  document.getElementById("ap-search").addEventListener("input", (e) => {
    renderAllPricesTable("ap-table", e.target.value, curCat);
  });
  document.addEventListener("prices:updated", () => renderAllPricesTable("ap-table", document.getElementById("ap-search").value, curCat));

});
</script>
</body>
</html>
