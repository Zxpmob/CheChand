</head>
<body>
<header class="site-header" id="site-header"></header>
<main>

<div class="container">
  <section class="hero" style="padding:40px 0 10px;text-align:right;">
    <span class="eyebrow"><span class="dot"></span> جستجوی سراسری</span>
    <h1 style="font-size:clamp(1.6rem,4vw,2.4rem);">دنبال <span>چه قیمتی</span> می‌گردید؟</h1>
    <div class="search-box glass-strong" style="max-width:560px;margin-top:16px;">
      <input id="s-input" type="text" placeholder="مثلاً: طلا، دلار، سکه امامی، بیت‌کوین…">
    </div>
  </section>
  <section class="section">
    <div class="flex gap-8" id="s-pills" style="flex-wrap:wrap;margin-bottom:18px;"></div>
    <div class="grid-prices" id="s-grid"></div>
  </section>
</div>

</main>
<footer class="site-footer" id="site-footer"></footer>

  <script src="items.js?v=20260815e" defer></script>
  <script src="data.js?v=20260815e" defer></script>
  <script src="favorites.js?v=20260815e" defer></script>
  <script src="alerts.js?v=20260815e" defer></script>
  <script src="render.js?v=20260815e" defer></script>
  <script src="components.js?v=20260815e" defer></script>

<script defer>
document.addEventListener("DOMContentLoaded", () => {
  renderHeader("search.html");
  renderFooter();
  initPriceEngine();

  const params = new URLSearchParams(location.search);
  const input = document.getElementById("s-input");
  input.value = params.get("q") || "";
  const pillsEl = document.getElementById("s-pills");
  const cats = [{id:"all", title:"همه"}, ...SITE_CATEGORIES];
  let curCat = "all";
  function drawPills() {
    pillsEl.innerHTML = cats.map(c => `<button class="pill" data-c="${c.id}" aria-pressed="${c.id===curCat}">${c.title}</button>`).join("");
    pillsEl.querySelectorAll(".pill").forEach(b => b.addEventListener("click", () => { curCat = b.dataset.c; drawPills(); draw(); }));
  }
  function draw() {
    const q = norm(input.value);
    let items = SITE_ITEMS.filter(i => (curCat==="all" || i.cat===curCat) && (!q || norm(i.name).includes(q)));
    const el = document.getElementById("s-grid");
    el.innerHTML = items.length ? items.map(priceCardHTML).join("") : `<div class="empty-state">چیزی پیدا نشد. عبارت دیگری را امتحان کنید.</div>`;
  }
  drawPills(); draw();
  input.addEventListener("input", draw);
  document.addEventListener("prices:updated", draw);
  document.addEventListener("favorites:updated", draw);

});
</script>
</body>
</html>
