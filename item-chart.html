<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<script src="theme.js?v=20260820a"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نمودار نوسانات قیمت | چی چند</title>
<meta name="description" content="نمودار نوسانات قیمت امروز — با نگه‌داشتن موس روی نمودار، قیمت و ساعت دقیق هر لحظه را ببینید.">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#0a0a0c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CheChand">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css?v=20260820a">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<!-- عمداً افزونه‌ی زوم/درگ اینجا اضافه نشده — طبق خواسته، این نمودار باید
     ثابت بماند و با اسکرول یا کشیدن تغییر نکند؛ فقط هاور برای دیدن قیمت
     دقیق کار می‌کند. -->
</head>
<body>
<header class="site-header" id="site-header"></header>
<main>

<div class="container">
  <section class="hero" style="padding:40px 0 10px;text-align:right;">
    <span class="eyebrow"><span class="dot"></span> نمودار نوسانات</span>
    <h1 id="ic-title" style="font-size:clamp(1.6rem,4vw,2.4rem);">در حال بارگذاری…</h1>
    <p style="margin:0;" id="ic-sub"></p>
  </section>

  <section class="section">
    <div class="card glass" style="padding:22px 18px;">
      <div class="flex gap-8" id="ic-chart-pills" style="margin-bottom:14px;flex-wrap:wrap;"></div>
      <div style="position:relative;width:100%;height:340px;">
        <canvas id="ic-chart"></canvas>
      </div>
      <p class="text-dim" id="ic-note" style="font-size:.78rem;margin:14px 0 0;"></p>
    </div>
  </section>

  <section class="section">
    <a class="btn outline" id="ic-back" href="all-prices.html">‹ بازگشت</a>
  </section>
</div>

</main>
<footer class="site-footer" id="site-footer"></footer>

  <script src="items.js?v=20260823a" defer></script>
  <script src="data.js?v=20260823a" defer></script>
  <script src="favorites.js?v=20260820a" defer></script>
  <script src="alerts.js?v=20260820a" defer></script>
  <script src="render.js?v=20260820a" defer></script>
  <script src="components.js?v=20260820a" defer></script>

<script defer>
document.addEventListener("DOMContentLoaded", () => {
  renderHeader("");
  renderFooter();
  initPriceEngine();

  const params = new URLSearchParams(location.search);
  const id = params.get("id") || "";
  let icChart = null;
  let foundOnce = false;
  let activeRangeId = "7d";
  let lastHistoryLoadAt = 0;
  let isDrawing = false;
  const CHART_RANGES = [
    { id: "1d", label: "۲۴ ساعت", days: 1, maxRows: 400 },
    { id: "7d", label: "۷ روز", days: 7, maxRows: 2300 },
    { id: "30d", label: "۳۰ روز", days: 30, maxRows: 9000 },
  ];

  function fmtDateTime(ts) {
    return new Intl.DateTimeFormat("fa-IR", { dateStyle: "medium", timeStyle: "short" }).format(new Date(ts));
  }
  function fmtTimeShort(ts) {
    return new Intl.DateTimeFormat("fa-IR", { hour: "2-digit", minute: "2-digit" }).format(new Date(ts));
  }

  if (!id) {
    document.getElementById("ic-title").textContent = "موردی مشخص نشده";
    document.getElementById("ic-sub").textContent = "این صفحه باید از روی آیکن نمودار کنار هر قیمت باز شود.";
  }

  function activeRange() {
    return CHART_RANGES.find((range) => range.id === activeRangeId) || CHART_RANGES[0];
  }

  function drawRangePills() {
    const pills = document.getElementById("ic-chart-pills");
    pills.innerHTML = CHART_RANGES.map((range) =>
      `<button class="pill" data-range="${range.id}" aria-pressed="${range.id === activeRangeId}">${range.label}</button>`
    ).join("");
    pills.querySelectorAll(".pill").forEach((button) => button.addEventListener("click", () => {
      activeRangeId = button.dataset.range;
      drawRangePills();
      draw(true);
    }));
  }
  drawRangePills();

  async function draw(force) {
    if (!id) return;
    if (isDrawing) return;
    const it = SITE_ITEMS.find((i) => i.id === id);
    const cat = it ? SITE_CATEGORIES.find((c) => c.id === it.cat) : null;

    if (it) {
      foundOnce = true;
      document.title = "نمودار " + it.name + " | چی چند";
      document.getElementById("ic-title").innerHTML = `نوسانات <span>${it.name}</span>`;
      const d = PriceStore.data[it.id];
      document.getElementById("ic-sub").textContent = d
        ? `قیمت فعلی: ${formatPrice(d.price)} ${it.unit}`
        : "در حال دریافت قیمت لحظه‌ای…";
      document.getElementById("ic-back").href = cat ? cat.page : "all-prices.html";
    } else if (!foundOnce) {
      document.getElementById("ic-title").textContent = "در حال پیدا کردن این مورد…";
      document.getElementById("ic-sub").textContent = "چند لحظه صبر کنید؛ اگر چیزی نیامد، شاید لینک اشتباه باشد.";
    }

    const noteEl = document.getElementById("ic-note");
    if (typeof Chart === "undefined") {
      noteEl.innerHTML = '<span style="color:var(--danger);">نمودار بارگذاری نشد — احتمالاً کتابخانه‌ی نمودار (از یک CDN خارجی) از دسترس شما مسدود است. بقیه‌ی سایت باید سالم کار کند.</span>';
      return;
    }

    // نگذاریم هر دریافت قیمتِ ۳۰ثانیه‌ای دوباره هزاران ردیف تاریخچه را
    // بخواند. انتخاب بازه همیشه فوراً و با force دوباره بارگذاری می‌شود.
    if (!force && icChart && Date.now() - lastHistoryLoadAt < 4 * 60 * 1000) return;

    isDrawing = true;
    const range = activeRange();
    noteEl.textContent = `در حال دریافت قیمت‌های ثبت‌شدهٔ واقعی برای بازهٔ ${range.label}…`;
    let hist = [];
    try {
      hist = await loadItemHistory(id, {
        days: range.days,
        maxRows: range.maxRows,
        chartMaxPoints: 1200,
      });
    } catch (err) {
      console.error("[چی چند] دریافت تاریخچه‌ی نمودار ناموفق بود:", err);
      noteEl.textContent = "دریافت تاریخچهٔ واقعی فعلاً ناموفق بود؛ لطفاً چند لحظه دیگر دوباره تلاش کنید.";
      return;
    } finally {
      isDrawing = false;
      lastHistoryLoadAt = Date.now();
    }
    if (hist.length < 2) {
      noteEl.textContent = `برای بازهٔ ${range.label} هنوز دست‌کم دو قیمتِ واقعی ثبت نشده است. با ثبت به‌روزرسانی‌های بعدی، نمودار خودکار کامل می‌شود.`;
      return;
    }

    const points = hist;
    const scopeNote = `روند ${range.label}`;

    const chartData = points.map((p) => ({ x: p.t, y: p.p }));
    const goldColor = getComputedStyle(document.documentElement).getPropertyValue("--gold-1").trim() || "#d4af37";

    try {
      const ctx = document.getElementById("ic-chart").getContext("2d");
      if (icChart) { icChart.destroy(); icChart = null; }
      icChart = new Chart(ctx, {
        type: "line",
        data: {
          datasets: [{
            label: it ? it.name : id,
            data: chartData,
            borderColor: goldColor,
            backgroundColor: goldColor + "22",
            fill: true,
            tension: 0, // قبلاً ۰.۲۵ — منحنیِ نرمِ جعلی روی داده‌ی کم‌تراکم؛ حالا خط راست و صادق بین نقاط واقعی
            pointRadius: points.length > 450 ? 0 : 1.5,
            pointHoverRadius: 5,
            pointHoverBackgroundColor: goldColor,
            borderWidth: 2,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          interaction: { mode: "index", intersect: false },
          // بدون افزونه‌ی pan/zoom — عمداً — تا نمودار با اسکرول یا کشیدن
          // (درگ) تغییر نکند و همیشه همین بازه‌ی ثابت را نشان بدهد.
          events: ["mousemove", "mouseout", "touchstart", "touchmove"],
          scales: {
            x: {
              type: "linear",
              ticks: { color: "rgba(150,150,150,.7)", maxRotation: 0, callback: (v) => fmtTimeShort(v) },
              grid: { color: "rgba(150,150,150,.10)" },
            },
            y: {
              ticks: { color: "rgba(150,150,150,.7)", callback: (v) => formatPrice(v) },
              grid: { color: "rgba(150,150,150,.12)" },
            },
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              rtl: true,
              titleFont: { family: "Vazirmatn" },
              bodyFont: { family: "Vazirmatn" },
              callbacks: {
                title: (itemsArr) => (itemsArr.length ? fmtDateTime(itemsArr[0].parsed.x) : ""),
                label: (item) => formatPrice(item.parsed.y) + (it ? " " + it.unit : ""),
              },
            },
          },
        },
      });
    } catch (err) {
      console.error("[چی چند] رسم نمودار ناموفق بود:", err);
      noteEl.innerHTML = '<span style="color:var(--danger);">رسم نمودار با خطا مواجه شد. جزئیات در Console مرورگر (F12) موجود است.</span>';
      return;
    }

    noteEl.textContent = `${scopeNote} — هر نقطه یک قیمت ثبت‌شدهٔ واقعی است؛ اگر داده‌ها برای نمایش سریع‌تر فشرده شده باشند، همچنان از میانگین یا قیمت ساختگی استفاده نشده است. با نگه‌داشتن موس یا انگشت، زمان و قیمت دقیق را ببینید.`;
  }

  draw();
  document.addEventListener("items:updated", () => draw(true));
  document.addEventListener("prices:updated", () => draw(false));
});
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
