<body>
<header class="site-header" id="site-header"></header>
<main>

<div class="container">
  <section class="hero" style="padding:40px 0 10px;text-align:right;">
    <span class="eyebrow"><span class="dot"></span> فقط برای شما</span>
    <h1 style="font-size:clamp(1.6rem,4vw,2.4rem);">لیست <span>علاقه‌مندی‌ها</span></h1>
    <p style="margin:0;">مواردی که ستاره زده‌اید، اینجا و فقط در همین مرورگر ذخیره می‌شوند.</p>
  </section>
  <section class="section">
    <div class="grid-prices" id="fav-grid"></div>
  </section>
</div>

</main>
<footer class="site-footer" id="site-footer"></footer>

  <script src="items.js?v=20260815e" defer></script>
  <script src="data.js?v=20260815e" defer></script>
  <script src="favorites.js?v=20260815e" defer></script>
  <script src="alerts.js?v=20260815e" defer></script>
  <script src="render.js?v=20260815e" defer></script>
  <script src="components.js?v=20260815e" defer></script>

<script defer>
document.addEventListener("DOMContentLoaded", () => {
  renderHeader("favorites.html");
  renderFooter();
  initPriceEngine();

  function draw() {
    const favs = getFavorites();
    const items = SITE_ITEMS.filter(i => favs.includes(i.id));
    const el = document.getElementById("fav-grid");
    el.innerHTML = items.length ? items.map(priceCardHTML).join("") :
      `<div class="empty-state">
         <div class="ee-icon">${ICONS.star}</div>
         هنوز چیزی به علاقه‌مندی‌ها اضافه نکرده‌اید.<br>
         از هر کارت قیمت، روی آیکن ستاره بزنید.
       </div>`;
  }
  draw();
  document.addEventListener("prices:updated", draw);
  document.addEventListener("favorites:updated", draw);

});
</script>
</body>
